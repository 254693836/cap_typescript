<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>商品管理</h1>
      <p id="status" role="status"></p>
      <section class="layout">
        <div>
          <h2>商品一覧</h2>
          <button id="new-button">新規登録</button>
          <table>
            <thead><tr><th>商品名</th><th>説明</th><th>価格</th><th>在庫</th><th></th></tr></thead>
            <tbody id="product-list"></tbody>
          </table>
        </div>
        <section id="editor" hidden>
          <h2 id="editor-title">新規登録</h2>
          <form id="product-form">
            <input id="id" type="hidden" />
            <label>商品名 <input id="name" required maxlength="100" /></label>
            <label>説明 <textarea id="description" maxlength="500"></textarea></label>
            <label>価格 <input id="price" type="number" min="0" step="0.01" /></label>
            <label>在庫 <input id="stock" type="number" min="0" step="1" /></label>
            <div class="actions">
              <button type="submit">保存</button>
              <button type="button" id="check-button">Check</button>
              <button type="button" id="cancel-button">キャンセル</button>
            </div>
          </form>
        </section>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
